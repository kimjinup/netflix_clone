name: Deploy to GitHub Pages

# main 브랜치에 push가 발생할 때 자동으로 동작
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 가저오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js 환경 세팅
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 패키지 설치 및 빌드 (등록한 Secret 환경변수 주입)
      - name: Install and Build
        run: |
          npm ci
          npm run build
        env:
          VITE_TMDB_ACCESS_TOKEN: ${{ secrets.VITE_TMDB_ACCESS_TOKEN }}

      # 4. 빌드 결과물(dist 폴더)을 gh-pages 브랜치로 배포
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
